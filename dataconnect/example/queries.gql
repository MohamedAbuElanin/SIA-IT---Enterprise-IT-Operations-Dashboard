mutation CreateAsset($data: Asset_Data!) @auth(level: USER) {
  asset_insert(data: $data)
}

mutation UpdateAsset($id: UUID!, $data: Asset_Data!) @auth(level: USER) {
  asset_update(id: $id, data: $data)
}

mutation DeleteAsset($id: UUID!) @auth(level: USER) {
  asset_delete(id: $id)
}

query GetAsset($id: UUID!) @auth(level: USER) {
  asset(id: $id) {
    name
    type
    status
    ipAddress
    location
    lastMaintenanceDate
  }
}

query ListAssets @auth(level: PUBLIC, insecureReason: "Public asset registry") {
  assets {
    id
    name
    status
  }
}

